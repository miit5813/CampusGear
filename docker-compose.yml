services:
  db:
    image: postgres:16-alpine
    container_name: campusgear_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusgear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusgear_password}
      POSTGRES_DB: ${POSTGRES_DB:-campusgear}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusgear}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: campusgear_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-campusgear}:${POSTGRES_PASSWORD:-campusgear_password}@db:5432/${POSTGRES_DB:-campusgear}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic

volumes:
  pgdata:
