<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — CampusGear</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div id="messages"></div>
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3">Регистрация</h1>
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="fullName" class="form-label">ФИО</label>
                <input type="text" id="fullName" class="form-control" minlength="2" maxlength="150" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Электронная почта</label>
                <input type="email" id="email" class="form-control" required autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Пароль (минимум 8 символов)</label>
                <input type="password" id="password" class="form-control" minlength="8" maxlength="100" required autocomplete="new-password">
              </div>
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label for="userType" class="form-label">Статус</label>
                  <select id="userType" class="form-select">
                    <option value="student">Студент</option>
                    <option value="employee">Сотрудник</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="groupOrDepartment" class="form-label">Группа или подразделение</label>
                  <input type="text" id="groupOrDepartment" class="form-control" maxlength="100">
                </div>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Телефон (необязательно)</label>
                <input type="tel" id="phone" class="form-control" maxlength="30">
              </div>
              <div class="d-grid">
                <button id="submitRegister" type="submit" class="btn btn-primary">Зарегистрироваться</button>
              </div>
            </form>
            <p class="small text-muted mt-3 mb-0">Уже есть аккаунт? <a href="login.html">Войти</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container small text-muted">CampusGear — сервис аренды кампусного оборудования</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
