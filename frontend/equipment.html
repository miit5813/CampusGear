<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оборудование — CampusGear</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Каталог</a></li>
        <li class="breadcrumb-item active" id="breadcrumbName" aria-current="page">Устройство</li>
      </ol>
    </nav>

    <div id="messages"></div>

    <div class="row g-4">
      <div class="col-lg-7" id="equipmentInfo">
        <div class="text-center py-5"><div class="spinner-border" role="status"><span class="visually-hidden">Загрузка...</span></div></div>
      </div>

      <div class="col-lg-5">
        <section class="card shadow-sm booking-card" id="bookingCard" hidden>
          <div class="card-body">
            <h2 class="h5 card-title">Аренда оборудования</h2>
            <p class="small text-muted" id="termsHint"></p>
            <form id="bookingForm" novalidate>
              <div class="row g-2">
                <div class="col-6">
                  <label for="startDate" class="form-label">С даты</label>
                  <input type="date" id="startDate" class="form-control" required>
                </div>
                <div class="col-6">
                  <label for="endDate" class="form-label">По дату</label>
                  <input type="date" id="endDate" class="form-control" required>
                </div>
              </div>
              <div id="availabilityBox" class="mt-3" aria-live="polite"></div>
              <div class="mt-3">
                <label for="userComment" class="form-label">Комментарий (необязательно)</label>
                <textarea id="userComment" class="form-control" rows="2" maxlength="500" placeholder="Например: для защиты проекта"></textarea>
              </div>
              <div class="d-grid mt-3">
                <button id="submitBooking" type="submit" class="btn btn-primary">Подать заявку</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container small text-muted">CampusGear — сервис аренды кампусного оборудования</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/equipment.js"></script>
</body>
</html>
