<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявки — CampusGear</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <h1 class="h3 mb-0">Заявки на аренду</h1>
      <div>
        <label for="statusFilter" class="visually-hidden">Статус заявки</label>
        <select id="statusFilter" class="form-select">
          <option value="pending" selected>На рассмотрении</option>
          <option value="approved">Одобренные</option>
          <option value="rejected">Отклонённые</option>
          <option value="cancelled">Отменённые</option>
          <option value="">Все заявки</option>
        </select>
      </div>
    </div>

    <div id="messages"></div>
    <div id="bookingList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container small text-muted">CampusGear — сервис аренды кампусного оборудования</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
