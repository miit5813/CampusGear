<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — CampusGear</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div id="messages"></div>
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3">Вход в CampusGear</h1>
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Электронная почта</label>
                <input type="email" id="email" class="form-control" required autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" class="form-control" required autocomplete="current-password">
              </div>
              <div class="d-grid">
                <button id="submitLogin" type="submit" class="btn btn-primary">Войти</button>
              </div>
            </form>
            <p class="small text-muted mt-3 mb-0">Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container small text-muted">CampusGear — сервис аренды кампусного оборудования</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
