<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои заявки — CampusGear</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <div id="messages"></div>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h1 class="h4 mb-1" id="profileName">Личный кабинет</h1>
        <p class="text-muted mb-0" id="profileDetails"></p>
      </div>
    </section>

    <section class="mb-4">
      <h2 class="h5 mb-3">Текущие аренды и заявки</h2>
      <div id="activeList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
    </section>

    <section>
      <h2 class="h5 mb-3">История</h2>
      <div id="historyList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
    </section>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container small text-muted">CampusGear — сервис аренды кампусного оборудования</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/my-bookings.js"></script>
</body>
</html>
