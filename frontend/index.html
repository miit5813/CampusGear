<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — CampusGear</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <div class="mb-4">
      <h1 class="h2">Каталог оборудования</h1>
      <p class="text-muted mb-0">Выберите устройство, чтобы посмотреть условия и подать заявку на аренду</p>
    </div>

    <div id="messages"></div>

    <form id="filterForm" class="row g-2 mb-4">
      <div class="col-12 col-md-5">
        <label for="searchInput" class="visually-hidden">Поиск по названию</label>
        <input id="searchInput" type="search" class="form-control" placeholder="Поиск по названию">
      </div>
      <div class="col-8 col-md-5">
        <label for="categoryFilter" class="visually-hidden">Категория</label>
        <select id="categoryFilter" class="form-select">
          <option value="">Все категории</option>
        </select>
      </div>
      <div class="col-4 col-md-2 d-grid">
        <button class="btn btn-primary" type="submit">Найти</button>
      </div>
    </form>

    <div id="equipmentList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container small text-muted">CampusGear — сервис аренды кампусного оборудования</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/catalog.js"></script>
</body>
</html>
